<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Personal Information - SmartPrep AI
</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: "Segoe UI", Arial, sans-serif;

    background: #0f172a;

    color: #f8fafc;

    padding: 20px;
}

.container {
    width: 100%;
    max-width: 600px;

    background: #1e293b;

    padding: 35px;

    border-radius: 15px;

    box-shadow:
        0 15px 40px
        rgba(0, 0, 0, 0.4);
}

.step {
    color: #38bdf8;

    font-weight: bold;

    margin-bottom: 8px;

    font-size: 14px;
}

h1 {
    margin: 0 0 8px;

    color: #f8fafc;

    font-size: 28px;
}

.description {
    color: #94a3b8;

    margin-bottom: 25px;

    line-height: 1.5;
}

label {
    display: block;

    margin-top: 16px;

    margin-bottom: 7px;

    font-weight: 600;

    color: #f8fafc;
}

input,
select {

    width: 100%;

    padding: 13px;

    border: 1px solid #475569;

    border-radius: 7px;

    background: #0f172a;

    color: white;

    font-size: 15px;

    outline: none;
}

input::placeholder {
    color: #64748b;
}

input:focus,
select:focus {

    border-color: #38bdf8;

    box-shadow:
        0 0 0 2px
        rgba(56, 189, 248, 0.15);
}

select {
    cursor: pointer;
}

select option {

    background: #0f172a;

    color: white;
}

button {

    width: 100%;

    padding: 14px;

    margin-top: 25px;

    border: none;

    border-radius: 7px;

    background: #38bdf8;

    color: #0f172a;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;
}

button:hover {

    background: #0ea5e9;

    transform: translateY(-1px);
}

.error {

    background: #7f1d1d;

    color: #fecaca;

    padding: 12px;

    border-radius: 7px;

    margin-bottom: 15px;

    font-size: 14px;
}

.required-note {

    margin-top: 18px;

    color: #64748b;

    font-size: 12px;

    text-align: center;
}

@media (max-width: 600px) {

    body {
        padding: 15px;
    }

    .container {
        padding: 25px 20px;
    }

    h1 {
        font-size: 24px;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="step">
        STEP 2 OF 6
    </div>

    <h1>
        👤 Personal Information
    </h1>

    <p class="description">
        Tell us about yourself so the AI can personalize your interview.
    </p>

    <!-- ERROR_MESSAGE -->

    <form
        action="/personal"
        method="post"
        autocomplete="off"
    >

        <label for="name">
            Full Name
        </label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            autocomplete="off"
            required
        >

        <label for="age">
            Age
        </label>

        <input
            type="number"
            id="age"
            name="age"
            min="13"
            max="80"
            placeholder="Enter your age"
            autocomplete="off"
            required
        >

        <label for="gender">
            Gender
        </label>

        <select
            id="gender"
            name="gender"
            autocomplete="off"
            required
        >

            <option value="">
                Select gender
            </option>

            <option value="Male">
                Male
            </option>

            <option value="Female">
                Female
            </option>

            <option value="Other">
                Other
            </option>

        </select>

        <label for="phone">
            Contact Number
        </label>

        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter your contact number"
            autocomplete="off"
            pattern="[0-9]{10}"
            maxlength="10"
            inputmode="numeric"
            title="Please enter a 10-digit contact number"
            required
        >

        <button type="submit">
            Save & Continue →
        </button>

    </form>

    <div class="required-note">
        All fields are required.
    </div>

</div>

</body>

</html
